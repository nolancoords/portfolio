<style>
  :root {
    --bg: #0a0a0a;
    --fg: #e8e4dc;
    --accent: #c8f542;
    --muted: #3a3a3a;
    --border: 2px solid #2a2a2a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow: hidden;
  }

  .element-class {
      scrollbar-width: none;          
      -ms-overflow-style: none;      
  }

  .element-class::-webkit-scrollbar {
      display: none;                
  }

  canvas { position: fixed; inset: 0; pointer-events: none; }
  #canvas-click { pointer-events: all; z-index: 4; }
  #canvas-physics { z-index: 2; }
  #canvas-quant { z-index: 2; }
  #canvas-led { z-index: 2; }

  /* ── LED CIRCUIT DIAGRAM (Top Left) ── */
  .circuit-container {
    position: absolute;
    bottom: 2rem;
    right: .5rem;
    z-index: 5;
    background: rgba(10, 10, 10, 0.8);
    border: 1px solid var(--muted);
    padding: 1rem;
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    pointer-events: all;
  }

  .circuit-header {
      padding: 10px;
      background-color: white;
      color: #ffffff;
      cursor: move; /* Changes cursor to a crosshair indicator */
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top-left-radius: 2px;
      border-top-right-radius: 2px;
      user-select: none;
  }

  .circuit-svg {
    background: #111;
    border: 1px solid #222;
    border-radius: 2px;
  }

  /* LED Glow Animation and states */
  .led-element {
    transition: fill 0.1s ease, filter 0.1s ease;
    z-index: 2;
  }
  
  .led-glow {
    opacity: 0;
    transition: opacity 0.1s ease;
    z-index: 0;
  }

  .circuit-container.active .led-element {
    fill: var(--accent);
  }

  .circuit-container.active .led-glow {
    opacity: 0.35;
  }

  /* Circuit Button */
  .circuit-message {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--fg);
    background: transparent;
    border: 1px solid var(--muted);
    padding: 0.5rem 1rem;
    cursor: pointer;
    transition: all 0.15s;
    width: 100%;
  }

  .circuit-btn {
  position: absolute;
  top: 35%;
  left: 50%;

  transform: translate(-50%, -50%);
  width: 15px;
  height: 15px;
  border-radius: 25%;
  background: #111;
  border: 1.5px solid #555;
  cursor: pointer;
  color: var(--fg);
  font-family: 'Space Mono', monospace;
  font-size: 0.25rem;
  letter-spacing: 0.05em;
  transition: border-color 0.15s;
  z-index: 10;
}
.circuit-btn:hover { border-color: var(--accent); color: var(--accent); }
.circuit-btn:active { background: var(--accent); color: var(--bg); }

  .circuit-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .circuit-btn:active {
    background: var(--accent);
    color: var(--bg);
  }

  /* ── CENTER NAV ── */
  .nav-center {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    z-index: 10;
    pointer-events: none;
  }

  .site-title {
    font-family: 'Space Mono', monospace;
    font-size: clamp(1rem, 2vw, 1.4rem);
    letter-spacing: 0.3em;
    color: white;
    text-transform: uppercase;
    margin-bottom: 3rem;
  }

  .site-subtitle {
    font-family: 'Space Mono', monospace;
    font-size: 20;
    letter-spacing: 0.2em;
    color: white;
    text-transform: uppercase;
    margin-bottom: 3rem;
    display: flex;
    justify-content: center; 
    align-items: center;     
  }

  .site-subsubtitle {
    font-family: 'Space Mono', monospace;
    font-size: 20;
    letter-spacing: 0.2em;
    color: gray;
    text-transform: uppercase;
    margin-bottom: 3rem;
    display: flex;
    justify-content: center; 
    align-items: center; 
    pointer-events: auto;
    
  }



  .nav-buttons {
    display: flex;
    flex-direction: column;
    gap: 0;
    pointer-events: all;
    border: var(--border);
  }

  .nav-btn {
    font-family: 'Space Mono', monospace;
    font-size: clamp(0.75rem, 1.2vw, 0.9rem);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--fg);
    background: transparent;
    border: none;
    border-bottom: var(--border);
    padding: 1.1rem 3.5rem;
    cursor: pointer;
    position: relative;
    transition: color 0.15s, background 0.15s;
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .nav-btn:last-child { border-bottom: none; }

  .nav-btn::before {
    content: '';
    display: block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.15s;
    flex-shrink: 0;

  .nav-btn:hover {

    color: var(--bg);

  .nav-btn:hover::before {

  /* ── HOVER PREVIEW IMAGES ── */

    position: fixed;

  }

  .preview-img.visible { opacity: 1; }

  /* positions */
  .preview-top    { top: 2rem; left: 50%; transform: translateX(-50%); }
  .preview-left   { left: 2rem; top: 50%; transform: translateY(-50%); }
  .preview-right  { right: 2rem; top: 50%; transform: translateY(-50%); }
  .preview-bottom { bottom: 2rem; left: 50%; transform: translateX(-50%); }

  .preview-label {

    border: 1px solid var(--accent);
    position: absolute;
    top: 0.5rem;
    left: 0.5rem;
  }

  /* corner labels */
 
</style>

<script>
// ── UTIL ──────────────────────────────────────────────────
function resize(canvas) {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}


(function() {
  const canvas = document.getElementById('canvas-click');
  const ctx = canvas.getContext('2d');
  canvas.addEventListener('click', e => {
    const qx = window.innerWidth  ;
    const qy = window.innerHeight ;
    

    for (let i = 0; i < 5; i++) {
      bubbles.push({
        x: e.clientX + (Math.random() - 0.5) * 30,
        y: e.clientY + (Math.random() - 0.5) * 30,
        r: 8 + Math.random() * 20,
        vx: (Math.random() - 0.5) * 2,
        vy: -1 - Math.random() * 2,
        alpha: 0.9,
        hue: 70 + Math.random() * 40,
      });
    }
  });
  resize(canvas);
  

  const bubbles = [];

  

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      b.x += b.vx; b.y += b.vy;
      b.vy += 0.03;
      b.alpha -= 0.012;
      if (b.alpha <= 0) { bubbles.splice(i, 1); continue; }
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.strokeStyle = `hsla(${b.hue}, 90%, 60%, ${b.alpha})`;
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

(function() {
  const canvas = document.getElementById('canvas-physics');
  const ctx = canvas.getContext('2d');

  canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  fragments.forEach(frag => {
    const dx = mx - frag.x;
    const dy = my - frag.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    // simple hit detection
    if (dist < frag.r) {
      // rotate velocity 90° clockwise: (vx, vy) -> (vy, -vx)
    const newVx = -frag.vy;
    const newVy = frag.vx;

      frag.vx = newVx;
      frag.vy = newVy;
    }
  });
});

  resize(canvas);
  window.addEventListener('resize', () => resize(canvas));

  // --- Animation States ---
  // 0: Approaching, 1: Splitting / Resetting
  let animationState = 0; 
  let frameCounter = 0;

  // --- Main Balls Setup ---
  const cy = 100;
  const r = 28;
  
  // Start them further apart (e.g., left side and center-right)
  let x1 = 30; 
  let x2 = 170; 
  const speed = 2.5; // Constant approach speed

  // --- Fragment Setup (for after the split) ---
  let fragments = [];

  function initFragments(startX, startY) {
    fragments = [
      { x: startX, y: startY, vx: 1.5, vy: -1.2, r: r * 0.6 },  // Top-right shard
      { x: startX, y: startY, vx: 2.0, vy: 1.2,  r: r * 0.6 }   // Bottom-right shard
    ];
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // ── STATE 0: APPROACH & COLLISION DETECTION ────────────────
    if (animationState === 0) {
      // Move ball 1 toward ball 2
      x1 += speed;

      // Check if the lines/boundaries intersect: distance between centers <= sum of radii
      if ((x2 - x1) <= (r * 2)) {
        // Correct position to exact impact point
        x1 = x2 - (r * 2); 
        animationState = 1;
        frameCounter = 0;
        initFragments(x2, cy); // Spawn fragments at Ball 2's position
      }

      // Draw Ball 1 (Striker)
      ctx.beginPath();
      ctx.arc(x1, cy, r, 0, Math.PI * 2);
      ctx.strokeStyle = '#e8e4dc';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Velocity Arrow for Ball 1
      ctx.beginPath();
      ctx.moveTo(x1, cy);
      ctx.lineTo(x1 + 15, cy);
      ctx.strokeStyle = 'rgba(200,245,66,0.6)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Draw Ball 2 (Target)
      ctx.beginPath();
      ctx.arc(x2, cy, r, 0, Math.PI * 2);
      ctx.strokeStyle = '#e8e4dc';
      ctx.lineWidth = 2;
      ctx.stroke();

    // ── STATE 1: BREAK OFF / SHATTER ───────────────────────────
    } else if (animationState === 1) {
      frameCounter++;

      // Draw Ball 1 (Stops or slows down significantly upon impact)
      ctx.beginPath();
      ctx.arc(x1, cy, r, 0, Math.PI * 2);
      ctx.strokeStyle = '#e8e4dc';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Draw and update the two smaller fragments
      fragments.forEach(frag => {
        frag.x += frag.vx;
        frag.y += frag.vy;

        ctx.beginPath();
        ctx.arc(frag.x, frag.y, frag.r, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(232, 228, 220, 0.8)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        
        // Dynamic green energy trailing line for fragments
        ctx.beginPath();
        ctx.moveTo(frag.x, frag.y);
        ctx.lineTo(frag.x - (frag.vx * 3), frag.y - (frag.vy * 3));
        ctx.strokeStyle = 'rgba(200,245,66,0.4)';
        ctx.lineWidth = 1;
        ctx.stroke();
      });

      // Brief flash effect at point of impact
      if (frameCounter < 6) {
        ctx.beginPath();
        ctx.arc(x1 + r, cy, r * 1.2, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(200,245,66,0.08)';
        ctx.fill();
      }

      // Reset the loop after 100 frames of explosion
      if (frameCounter > 100) {
        // rewind the ball position backwards
        x1 -= speed; 
        if (frameCounter > 400) { 
            animationState = 0; }
      }
    }

    requestAnimationFrame(draw);
  }

  
  draw();


})();
// ── 3. QUANT CIRCLES (bottom-left) ───────────────────────
(function() {
  const canvas = document.getElementById('canvas-quant');
  const ctx = canvas.getContext('2d');
  resize(canvas);
  window.addEventListener('resize', () => resize(canvas));

  const tickers = [
    { sym: 'APPL', price: 142, color: '#e8e4dc' },
    { sym: 'TSLA', price: 87,  color: '#e8e4dc' },
    { sym: 'GOOGL', price: 310, color: '#e8e4dc' },
  ];

  // FIX 1: Reduced history from 30 to 12. Fewer points mean wider, more visible waves!
  const histories = tickers.map((tk) => Array.from({length: 12}, () => tk.price / 400));
  let t = 0;

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const bx = 40, by = canvas.height - 180;
    t++;

    tickers.forEach((tk, i) => {
      // Slow, organic drift
      tk.price += (Math.random() - .5) * 100;
      tk.price = Math.max(10, Math.min(390, tk.price));

      const hist = histories[i];
      hist.push(tk.price / 400);
      if (hist.length > 12) hist.shift(); // Keep it matching the new length

      const cx = bx + i * 90 + 30;
      const cy = by + 30;
      const r = 26;

      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.clip();

      // FIX 2: Cubic Bezier Curve implementation for distinct "wavy" flowing look
      if (hist.length > 1) {
        ctx.beginPath();
        
        // Map data index to X coordinate inside the circle
        const getX = (index) => cx - r + (index / (hist.length - 1)) * r * 10;
        // Map data value to Y coordinate inside the circle
        const getY = (val) => cy + r - val * r * 1.8;

        ctx.moveTo(getX(0), getY(hist[0]));

        for (let j = 0; j < hist.length - 1; j++) {
          const x0 = getX(j);
          const y0 = getY(hist[j]);
          const x1 = getX(j + 1);
          const y1 = getY(hist[j + 1]);

          // Calculate control points horizontally offset to force a smooth "S" wave between points
          const cpX1 = x0 + (x1 - x0) / 2;
          const cpY1 = y0;
          const cpX2 = x0 + (x1 - x0) / 2;
          const cpY2 = y1;

          ctx.bezierCurveTo(cpX1, cpY1, cpX2, cpY2, x1, y1);
        }

        const last = hist[hist.length - 1];
        const prev = hist[hist.length - 2];
        const up = last >= prev;
        
        ctx.strokeStyle = up ? '#c8f542' : '#f54242';
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
      }
      ctx.restore();

      // Circle border
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.strokeStyle = '#2a2a2a';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Labels
      ctx.font = '700 9px Space Mono, monospace';
      ctx.fillStyle = '#666';
      ctx.textAlign = 'center';
      ctx.fillText(tk.sym, cx, cy + r + 14);

      const up = hist[hist.length - 1] >= hist[hist.length - 2];
      ctx.font = '500 8px DM Sans, sans-serif';
      ctx.fillStyle = up ? '#c8f542' : '#f54242';
      ctx.fillText(tk.price.toFixed(0), cx, cy + r + 24);
    });

    requestAnimationFrame(draw);
  }

  canvas.addEventListener('click', (event) => {
  
  const rect = canvas.getBoundingClientRect();
  const mouseX = event.clientX - rect.left;
  const mouseY = event.clientY - rect.top;

  
  const bx = 40;
  const by = canvas.height - 180;
  const r = 26; // radius of the circle

  
  ticker.forEach((tk, i) => {
    const cx = bx + i * 90 + 30;
    const cy = by + 30;

  
    const distance = Math.sqrt((mouseX - cx) ** 2 + (mouseY - cy) ** 2);

    // If distance is less than the radius, it's a hit!
    if (distance <= r) {
      console.log(`Clicked on ticker: ${tk.sym}`, tk);
      
      // Put your click action here (e.g., open a modal, change a chart)
      alert(`You selected ${tk.sym} at $${tk.price.toFixed(0)}`);
    }
  });
});

  draw();
})();

// ── 4. LED ARRAY (top-right) ─────────────────────────────
(function() {
  const module = document.getElementById('led-circuit-module');
  const btn = document.getElementById('circuit-switch');

  // Activate on press down
  const turnOn = () => module.classList.add('active');
  // Deactivate on lift
  const turnOff = () => module.classList.remove('active');

  // Desktop events
  btn.addEventListener('mousedown', turnOn);
  btn.addEventListener('mouseup', turnOff);
  btn.addEventListener('mouseleave', turnOff);

  // Mobile / Touch handling
  btn.addEventListener('touchstart', (e) => { e.preventDefault(); turnOn(); });
  btn.addEventListener('touchend', turnOff);
})();

// ── HOVER PREVIEWS ─────────────────────────────────────────
document.querySelectorAll('.nav-btn').forEach(btn => {
  const id = btn.dataset.preview;
  const panel = document.getElementById(id);
  if (!panel) return;
  btn.addEventListener('mouseenter', () => panel.classList.add('visible'));
  btn.addEventListener('mouseleave', () => panel.classList.remove('visible'));
});

const win = document.getElementById("led-circuit-module");
const header = document.querySelector(".circuit-header");

let isDragging = false;
let offsetX = 0;
let offsetY = 0;

header.addEventListener("mousedown", (e) => {
  isDragging = true;

  win.style.left = `${win.offsetLeft}px`;
  win.style.top = `${win.offsetTop}px`;
  win.style.right = "auto";
  win.style.bottom = "auto";

  offsetX = e.clientX - win.offsetLeft;
  offsetY = e.clientY - win.offsetTop;

  document.addEventListener("mousemove", mouseMoveHandler);
  document.addEventListener("mouseup", mouseUpHandler);
});

function mouseMoveHandler(e) {
  if (!isDragging) return;

  win.style.left = `${e.clientX - offsetX}px`;
  win.style.top = `${e.clientY - offsetY}px`;
}

function mouseUpHandler() {
  isDragging = false;

  document.removeEventListener("mousemove", mouseMoveHandler);
  document.removeEventListener("mouseup", mouseUpHandler);
}




</script>
